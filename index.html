<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MiniCraft 3D</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    overflow: hidden;
    font-family: Arial;
    background: #87ceeb;
    touch-action: none;
}
canvas {
    display: block;
}
#crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-size: 28px;
    pointer-events: none;
    text-shadow: 1px 1px 3px black;
}
#top {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    background: #0008;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
}
#joystick {
    position: fixed;
    bottom: 35px;
    left: 25px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #ffffff55;
    border: 3px solid #ffffff99;
}
#stick {
    width: 48px;
    height: 48px;
    background: #ffffffcc;
    border-radius: 50%;
    position: absolute;
    top: 33px;
    left: 33px;
}
#buttons {
    position: fixed;
    right: 15px;
    bottom: 35px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
button {
    width: 70px;
    height: 60px;
    border: 2px solid white;
    background: #333a;
    color: white;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
}
#jump {
    position: fixed;
    right: 100px;
    bottom: 48px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 22px;
}
#inventory {
    position: fixed;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
}
.slot {
    width: 42px;
    height: 42px;
    border: 2px solid white;
    background: #333b;
    display: grid;
    place-items: center;
    color: white;
    font-size: 22px;
    border-radius: 5px;
}
.slot.active {
    border: 3px solid yellow;
    transform: translateY(-5px);
}
#hint {
    position: fixed;
    top: 65px;
    left: 12px;
    color: white;
    background: #0007;
    padding: 7px;
    border-radius: 5px;
    font-size: 11px;
}
</style>
</head>
<body>
<div id="top">🌍 MINICRAFT 3D</div>
<div id="hint">Проводи пальцем по экрану для обзора</div>
<div id="crosshair">+</div>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="jump">⬆</button>
<div id="buttons">
    <button id="break">⛏️<br>ЛОМАТЬ</button>
    <button id="place">🧱<br>СТАВИТЬ</button>
</div>
<div id="inventory">
    <div class="slot active" data-block="grass">🟩</div>
    <div class="slot" data-block="dirt">🟫</div>
    <div class="slot" data-block="stone">⬜</div>
    <div class="slot" data-block="wood">🪵</div>
    <div class="slot" data-block="leaves">🌳</div>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 65);
// CAMERA
const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    100
);
camera.position.set(0, 2, 5);
// RENDERER
const renderer = new THREE.WebGLRenderer({
    antialias: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.prepend(renderer.domElement);
// LIGHT
scene.add(new THREE.HemisphereLight(0xffffff, 0x65734b, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
scene.add(sun);
// BLOCK MATERIALS
const materials = {
    grass: 0x55aa33,
    dirt: 0x80502b,
    stone: 0x888888,
    wood: 0x79502b,
    leaves: 0x228833
};
const geometry = new THREE.BoxGeometry(1,1,1);
const blocks = [];
function addBlock(x,y,z,type) {
    const mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshLambertMaterial({
            color: materials[type]
        })
    );
    mesh.position.set(x,y,z);
    mesh.userData.type = type;
    scene.add(mesh);
    blocks.push(mesh);
    return mesh;
}
// WORLD
for(let x=-12; x<12; x++) {
    for(let z=-12; z<12; z++) {
        let height =
            Math.floor(
                Math.sin(x * 0.35) +
                Math.cos(z * 0.3)
            );
        height = Math.max(0,height);
        for(let y=-1; y<height; y++) {
            addBlock(
                x,
                y,
                z,
                y === height-1 ? "grass" : "dirt"
            );
        }
    }
}
// TREES
function createTree(x,z) {
    for(let y=0; y<3; y++) {
        addBlock(x,y+1,z,"wood");
    }
    for(let dx=-1; dx<=1; dx++) {
        for(let dz=-1; dz<=1; dz++) {
            for(let dy=2; dy<=4; dy++) {
                if(Math.random()>0.2) {
                    addBlock(
                        x+dx,
                        dy,
                        z+dz,
                        "leaves"
                    );
                }
            }
        }
    }
}
for(let i=0;i<15;i++) {
    let x=Math.floor(Math.random()*20)-10;
    let z=Math.floor(Math.random()*20)-10;
    if(Math.abs(x)<3 && Math.abs(z)<3) continue;
    createTree(x,z);
}
// WATER
const water = new THREE.Mesh(
    new THREE.BoxGeometry(8,0.15,8),
    new THREE.MeshLambertMaterial({
        color:0x2299ff,
        transparent:true,
        opacity:0.7
    })
);
water.position.set(7,0.1,7);
scene.add(water);
// PLAYER
let yaw=0;
let pitch=0;
let velocityY=0;
let grounded=true;
let selected="grass";
let movement={
    x:0,
    y:0
};
// CAMERA ROTATION
function look(dx,dy) {
    yaw -= dx*0.004;
    pitch -= dy*0.004;
    pitch=Math.max(-1.3,Math.min(1.3,pitch));
    camera.rotation.order="YXZ";
    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
}
// TOUCH LOOK
let lookTouch=null;
let lastX=0;
let lastY=0;
renderer.domElement.addEventListener(
    "pointerdown",e=>{
        if(e.clientX<innerWidth*0.35) return;
        lookTouch=e.pointerId;
        lastX=e.clientX;
        lastY=e.clientY;
    }
);
renderer.domElement.addEventListener(
    "pointermove",e=>{
        if(e.pointerId!==lookTouch) return;
        look(
            e.clientX-lastX,
            e.clientY-lastY
        );
        lastX=e.clientX;
        lastY=e.clientY;
    }
);
function stopLook(e) {
    if(e.pointerId===lookTouch) {
        lookTouch=null;
    }
}
renderer.domElement.addEventListener("pointerup",stopLook);
renderer.domElement.addEventListener("pointercancel",stopLook);
// JOYSTICK
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyActive=false;
joystick.addEventListener("pointerdown",e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e);
});
joystick.addEventListener("pointermove",e=>{
    if(joyActive) updateJoystick(e);
});
function updateJoystick(e) {
    const rect=joystick.getBoundingClientRect();
    let dx=e.clientX-(rect.left+60);
    let dy=e.clientY-(rect.top+60);
    const length=Math.sqrt(dx*dx+dy*dy);
    if(length>40) {
        dx=dx/length*40;
        dy=dy/length*40;
    }
    stick.style.left=(33+dx)+"px";
    stick.style.top=(33+dy)+"px";
    movement.x=dx/40;
    movement.y=dy/40;
}
function stopJoystick() {
    joyActive=false;
    movement.x=0;
    movement.y=0;
    stick.style.left="33px";
    stick.style.top="33px";
}
joystick.addEventListener("pointerup",stopJoystick);
joystick.addEventListener("pointercancel",stopJoystick);
// JUMP
document.getElementById("jump").onclick=()=>{
    if(grounded) {
        velocityY=0.15;
        grounded=false;
    }
};
// INVENTORY
document.querySelectorAll(".slot").forEach(slot=>{
    slot.onclick=()=>{
        document.querySelectorAll(".slot").forEach(s=>
            s.classList.remove("active")
        );
        slot.classList.add("active");
        selected=slot.dataset.block;
    };
});
// RAYCASTER
const raycaster=new THREE.Raycaster();
function getTarget() {
    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );
    return raycaster.intersectObjects(blocks,false)[0];
}
// BREAK
document.getElementById("break").onclick=()=>{
    const hit=getTarget();
    if(!hit) return;
    const block=hit.object;
    scene.remove(block);
    blocks.splice(blocks.indexOf(block),1);
};
// PLACE
document.getElementById("place").onclick=()=>{
    const hit=getTarget();
    if(!hit) return;
    if(hit.distance>5) return;
    const pos=hit.object.position.clone()
        .add(hit.face.normal);
    // Не ставить блок прямо в игрока
    if(pos.distanceTo(camera.position)<1.5) return;
    addBlock(
        Math.round(pos.x),
        Math.round(pos.y),
        Math.round(pos.z),
        selected
    );
};
// KEYBOARD
window.addEventListener("keydown",e=>{
    if(e.key==="w") movement.y=-1;
    if(e.key==="s") movement.y=1;
    if(e.key==="a") movement.x=-1;
    if(e.key==="d") movement.x=1;
});
window.addEventListener("keyup",e=>{
    if(["w","s"].includes(e.key)) movement.y=0;
    if(["a","d"].includes(e.key)) movement.x=0;
});
// GAME LOOP
function animate() {
    requestAnimationFrame(animate);
    const speed=0.07;
    camera.position.x +=
        (-Math.sin(yaw)*movement.y+
        Math.cos(yaw)*movement.x)*speed;
    camera.position.z +=
        (-Math.cos(yaw)*movement.y-
        Math.sin(yaw)*movement.x)*speed;
    camera.position.y+=velocityY;
    velocityY-=0.008;
    if(camera.position.y<=2) {
        camera.position.y=2;
        velocityY=0;
        grounded=true;
    }
    renderer.render(scene,camera);
}
animate();
// RESIZE
window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
