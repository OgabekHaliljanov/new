<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MiniCraft 3D</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}
body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial;
    touch-action: none;
}
canvas {
    display: block;
    touch-action: none;
}
/* Верхняя панель */
#top {
    position: fixed;
    top: 10px;
    left: 10px;
    background: #222b;
    color: white;
    padding: 9px 14px;
    border-radius: 7px;
    font-weight: bold;
    z-index: 5;
}
/* Прицел */
#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 27px;
    text-shadow: 1px 1px 4px black;
    pointer-events: none;
}
/* Камера */
#cameraMode {
    position: fixed;
    right: 12px;
    top: 10px;
    width: 105px;
    height: 42px;
    font-size: 12px;
    z-index: 10;
}
/* Кнопки */
button {
    background: #333b;
    color: white;
    border: 2px solid #ffffffaa;
    border-radius: 9px;
    font-weight: bold;
    touch-action: none;
}
button:active {
    background: #888b;
}
/* Управление как Minecraft PE */
#joystick {
    position: fixed;
    left: 18px;
    bottom: 35px;
    width: 145px;
    height: 115px;
    z-index: 5;
}
.move {
    position: absolute;
    width: 43px;
    height: 43px;
    font-size: 22px;
}
#forward {
    left: 51px;
    top: 0;
}
#backward {
    left: 51px;
    bottom: 0;
}
#left {
    left: 0;
    top: 36px;
}
#right {
    right: 0;
    top: 36px;
}
/* Прыжок */
#jump {
    position: fixed;
    right: 105px;
    bottom: 45px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-size: 24px;
    z-index: 5;
}
/* Действия */
#buttons {
    position: fixed;
    right: 15px;
    bottom: 28px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    z-index: 5;
}
.action {
    width: 70px;
    height: 55px;
    font-size: 12px;
}
/* Инвентарь */
#inventory {
    position: fixed;
    left: 50%;
    bottom: 5px;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 6;
}
.slot {
    width: 42px;
    height: 42px;
    background: #333c;
    border: 2px solid #ddd;
    border-radius: 4px;
    display: grid;
    place-items: center;
    font-size: 23px;
}
.slot.active {
    border: 3px solid yellow;
    transform: translateY(-5px);
}
/* Поворот телефона */
#rotateWarning {
    display: none;
    position: fixed;
    inset: 0;
    background: #172b16;
    color: white;
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    gap: 20px;
}
#rotateWarning span {
    font-size: 65px;
}
@media (orientation: portrait) {
    #rotateWarning {
        display: flex;
    }
}
</style>
</head>
<body>
<div id="rotateWarning">
    <span>📱 ↻</span>
    <h2>MINICRAFT 3D</h2>
    <p>Поверни телефон горизонтально!</p>
</div>
<div id="top">🌍 MINICRAFT 3D</div>
<div id="crosshair">+</div>
<button id="cameraMode">👤 1-Е ЛИЦО</button>
<div id="joystick">
    <button class="move" id="forward">▲</button>
    <button class="move" id="backward">▼</button>
    <button class="move" id="left">◀</button>
    <button class="move" id="right">▶</button>
</div>
<button id="jump">⬆</button>
<div id="buttons">
    <button class="action" id="break">
        ⛏️<br>ЛОМАТЬ
    </button>
    <button class="action" id="place">
        🧱<br>СТАВИТЬ
    </button>
</div>
<div id="inventory">
    <div class="slot active" data-block="grass">🟩</div>
    <div class="slot" data-block="dirt">🟫</div>
    <div class="slot" data-block="stone">⬜</div>
    <div class="slot" data-block="wood">🪵</div>
    <div class="slot" data-block="leaves">🌳</div>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
/* =========================
   СОЗДАНИЕ МИРА
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 85);
/* =========================
   КАМЕРА
========================= */
const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    120
);
/* =========================
   РЕНДЕР
========================= */
const renderer = new THREE.WebGLRenderer({
    antialias: false
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(
    Math.min(devicePixelRatio, 1.5)
);
document.body.prepend(renderer.domElement);
/* =========================
   ОСВЕЩЕНИЕ
========================= */
scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x667744,
        2
    )
);
const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);
sun.position.set(20, 30, 10);
scene.add(sun);
/* =========================
   PIXEL TEXTURES
========================= */
function makeTexture(base, details) {
    const canvas = document.createElement("canvas");
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 400; i++) {
        ctx.fillStyle = details[
            Math.floor(Math.random() * details.length)
        ];
        const x = Math.floor(Math.random() * 64);
        const y = Math.floor(Math.random() * 64);
        const size = 1 + Math.floor(Math.random() * 4);
        ctx.fillRect(x, y, size, size);
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}
const textures = {
    grassTop: makeTexture(
        "#55a832",
        ["#70bd3b", "#3d8d28", "#82c94a"]
    ),
    grassSide: makeTexture(
        "#79502e",
        ["#55a832", "#97623b", "#684323"]
    ),
    dirt: makeTexture(
        "#80502d",
        ["#99643c", "#684323", "#a87545"]
    ),
    stone: makeTexture(
        "#888888",
        ["#aaaaaa", "#666666", "#777777"]
    ),
    wood: makeTexture(
        "#79502b",
        ["#55351d", "#a4753c", "#684323"]
    ),
    leaves: makeTexture(
        "#278a30",
        ["#42aa38", "#176c24", "#65b63b"]
    )
};
const materials = {
    grass: [
        new THREE.MeshLambertMaterial({map: textures.grassSide}),
        new THREE.MeshLambertMaterial({map: textures.grassSide}),
        new THREE.MeshLambertMaterial({map: textures.grassTop}),
        new THREE.MeshLambertMaterial({map: textures.dirt}),
        new THREE.MeshLambertMaterial({map: textures.grassSide}),
        new THREE.MeshLambertMaterial({map: textures.grassSide})
    ],
    dirt: new THREE.MeshLambertMaterial({
        map: textures.dirt
    }),
    stone: new THREE.MeshLambertMaterial({
        map: textures.stone
    }),
    wood: new THREE.MeshLambertMaterial({
        map: textures.wood
    }),
    leaves: new THREE.MeshLambertMaterial({
        map: textures.leaves
    })
};
/* =========================
   БЛОКИ
========================= */
const geometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = [];
const blockMap = new Map();
function blockKey(x, y, z) {
    return `${x},${y},${z}`;
}
function addBlock(x, y, z, type) {
    x = Math.round(x);
    y = Math.round(y);
    z = Math.round(z);
    const key = blockKey(x, y, z);
    if (blockMap.has(key)) return null;
    const mesh = new THREE.Mesh(
        geometry,
        materials[type]
    );
    mesh.position.set(x, y, z);
    mesh.userData.type = type;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    blocks.push(mesh);
    blockMap.set(key, mesh);
    return mesh;
}
/* =========================
   ЗЕМЛЯ
========================= */
for (let x = -14; x <= 14; x++) {
    for (let z = -14; z <= 14; z++) {
        addBlock(x, 0, z, "grass");
        addBlock(x, -1, z, "dirt");
    }
}
/* =========================
   ДЕРЕВЬЯ
========================= */
function createTree(x, z) {
    for (let y = 1; y <= 4; y++) {
        addBlock(x, y, z, "wood");
    }
    for (let dx = -2; dx <= 2; dx++) {
        for (let dz = -2; dz <= 2; dz++) {
            for (let dy = 3; dy <= 5; dy++) {
                if (
                    Math.abs(dx) + Math.abs(dz) < 4
                ) {
                    if (Math.random() > 0.15) {
                        addBlock(
                            x + dx,
                            dy,
                            z + dz,
                            "leaves"
                        );
                    }
                }
            }
        }
    }
}
for (let i = 0; i < 22; i++) {
    const x = Math.floor(Math.random() * 25) - 12;
    const z = Math.floor(Math.random() * 25) - 12;
    if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
    createTree(x, z);
}
/* =========================
   ВОДА
========================= */
const water = new THREE.Mesh(
    new THREE.BoxGeometry(7, 0.2, 7),
    new THREE.MeshLambertMaterial({
        color: 0x2288ff,
        transparent: true,
        opacity: 0.7
    })
);
water.position.set(8, 0.3, 8);
scene.add(water);
/* =========================
   ПЕРСОНАЖ
========================= */
const player = new THREE.Group();
scene.add(player);
function bodyPart(w, h, d, color, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({
            color: color
        })
    );
    mesh.position.set(x, y, z);
    player.add(mesh);
    return mesh;
}
bodyPart(0.55, 0.65, 0.3, 0x294bba, 0, 1.1, 0);
bodyPart(0.4, 0.4, 0.4, 0xe2b18b, 0, 1.65, 0);
bodyPart(0.17, 0.17, 0.18, 0x222222, -0.1, 1.7, 0.2);
bodyPart(0.17, 0.17, 0.18, 0x222222, 0.1, 1.7, 0.2);
bodyPart(0.2, 0.65, 0.25, 0x263d9c, -0.17, 0.45, 0);
bodyPart(0.2, 0.65, 0.25, 0x263d9c, 0.17, 0.45, 0);
/* =========================
   ИГРОК
========================= */
let playerX = 0;
let playerY = 0;
let playerZ = 0;
let velocityY = 0;
let grounded = true;
let yaw = 0;
let pitch = 0;
let thirdPerson = false;
let selected = "grass";
const playerHeight = 1.7;
/* =========================
   ПЕРЕКЛЮЧЕНИЕ КАМЕРЫ
========================= */
const cameraButton = document.getElementById("cameraMode");
cameraButton.onclick = () => {
    thirdPerson = !thirdPerson;
    cameraButton.textContent = thirdPerson
        ? "👤 3-Е ЛИЦО"
        : "👤 1-Е ЛИЦО";
    player.visible = thirdPerson;
};
/* =========================
   ПОВОРОТ КАМЕРЫ
========================= */
let lookPointer = null;
let lastX = 0;
let lastY = 0;
renderer.domElement.addEventListener(
    "pointerdown",
    e => {
        if (e.clientX < innerWidth * 0.35) return;
        lookPointer = e.pointerId;
        lastX = e.clientX;
        lastY = e.clientY;
        renderer.domElement.setPointerCapture(e.pointerId);
    }
);
renderer.domElement.addEventListener(
    "pointermove",
    e => {
        if (e.pointerId !== lookPointer) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        yaw -= dx * 0.005;
        pitch -= dy * 0.005;
        pitch = Math.max(
            -1.3,
            Math.min(1.3, pitch)
        );
        lastX = e.clientX;
        lastY = e.clientY;
    }
);
function stopLook(e) {
    if (e.pointerId === lookPointer) {
        lookPointer = null;
    }
}
renderer.domElement.addEventListener("pointerup", stopLook);
renderer.domElement.addEventListener("pointercancel", stopLook);
/* =========================
   КНОПКИ ДВИЖЕНИЯ
========================= */
const movement = {
    forward: false,
    backward: false,
    left: false,
    right: false
};
const directions = [
    "forward",
    "backward",
    "left",
    "right"
];
directions.forEach(name => {
    const button = document.getElementById(name);
    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        button.setPointerCapture(e.pointerId);
        movement[name] = true;
    });
    function stop() {
        movement[name] = false;
    }
    button.addEventListener("pointerup", stop);
    button.addEventListener("pointercancel", stop);
});
/* =========================
   ПРЫЖОК
========================= */
document.getElementById("jump").onclick = () => {
    if (grounded) {
        velocityY = 0.16;
        grounded = false;
    }
};
/* =========================
   ИНВЕНТАРЬ
========================= */
document.querySelectorAll(".slot").forEach(slot => {
    slot.onclick = () => {
        document.querySelectorAll(".slot").forEach(s => {
            s.classList.remove("active");
        });
        slot.classList.add("active");
        selected = slot.dataset.block;
    };
});
/* =========================
   RAYCASTER
========================= */
const raycaster = new THREE.Raycaster();
function getTarget() {
    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );
    const hits = raycaster.intersectObjects(
        blocks,
        false
    );
    if (hits.length && hits[0].distance <= 6) {
        return hits[0];
    }
    return null;
}
/* =========================
   ЛОМАТЬ БЛОКИ
========================= */
document.getElementById("break").onclick = () => {
    const hit = getTarget();
    if (!hit) return;
    const block = hit.object;
    const pos = block.position;
    blockMap.delete(
        blockKey(pos.x, pos.y, pos.z)
    );
    scene.remove(block);
    const index = blocks.indexOf(block);
    if (index !== -1) {
        blocks.splice(index, 1);
    }
};
/* =========================
   СТАВИТЬ БЛОКИ
========================= */
document.getElementById("place").onclick = () => {
    const hit = getTarget();
    if (!hit) return;
    const pos = hit.object.position.clone();
    pos.add(hit.face.normal);
    const x = Math.round(pos.x);
    const y = Math.round(pos.y);
    const z = Math.round(pos.z);
    const distance = new THREE.Vector3(
        playerX,
        playerY + 1,
        playerZ
    ).distanceTo(pos);
    if (distance < 1.5) return;
    if (distance > 6) return;
    addBlock(x, y, z, selected);
};
/* =========================
   ОБНОВЛЕНИЕ ИГРЫ
========================= */
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);
    const speed = 4 * delta;
    // Движение
    let forward = 0;
    let sideways = 0;
    if (movement.forward) forward += 1;
    if (movement.backward) forward -= 1;
    if (movement.left) sideways -= 1;
    if (movement.right) sideways += 1;
    const length = Math.hypot(forward, sideways);
    if (length > 0) {
        forward /= length;
        sideways /= length;
    }
    playerX += (
        -Math.sin(yaw) * forward +
        Math.cos(yaw) * sideways
    ) * speed;
    playerZ += (
        -Math.cos(yaw) * forward -
        Math.sin(yaw) * sideways
    ) * speed;
    // Границы мира
    playerX = THREE.MathUtils.clamp(playerX, -14, 14);
    playerZ = THREE.MathUtils.clamp(playerZ, -14, 14);
    // Прыжок
    playerY += velocityY;
    velocityY -= 0.45 * delta;
    if (playerY <= 0) {
        playerY = 0;
        velocityY = 0;
        grounded = true;
    }
    // Персонаж
    player.position.set(
        playerX,
        playerY,
        playerZ
    );
    player.rotation.y = yaw;
    // Камера
    if (!thirdPerson) {
        camera.position.set(
            playerX,
            playerY + playerHeight,
            playerZ
        );
        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    } else {
        const distance = 5;
        const horizontal = Math.cos(pitch) * distance;
        camera.position.set(
            playerX + Math.sin(yaw) * horizontal,
            playerY + 2.2 + Math.sin(pitch) * distance,
            playerZ + Math.cos(yaw) * horizontal
        );
        camera.lookAt(
            playerX,
            playerY + 1.3,
            playerZ
        );
    }
    renderer.render(scene, camera);
}
animate();
/* =========================
   АЛЬБОМНЫЙ ЭКРАН
========================= */
async function landscapeMode() {
    try {
        if (screen.orientation?.lock) {
            await screen.orientation.lock("landscape");
        }
    } catch (e) {
        console.log("Поверни телефон вручную");
    }
}
document.addEventListener(
    "pointerdown",
    landscapeMode,
    { once: true }
);
/* =========================
   ИЗМЕНЕНИЕ РАЗМЕРА
========================= */
window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
        innerWidth,
        innerHeight
    );
});
</script>
</body>
</html>
